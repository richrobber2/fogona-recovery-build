name: Experimental fogona recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fogona-recovery
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Host preparation
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 repo
          df -h .
          free -h
      - name: Test recovery dependency validators
        shell: bash
        run: |
          python3 tests/test_required_scope.py
          python3 tests/test_link_scope.py
      - name: Sync minimal TWRP source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir android
          cd android
          git config --global user.email recovery-build@users.noreply.github.com
          git config --global user.name RecoveryBuild
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b 6dc117d9cbd08430daa16db2013560e1c4017fa8 --depth=1
          mkdir -p .repo/local_manifests
          cp ../support.xml .repo/local_manifests/support.xml
          repo sync -c -j2 --no-tags --no-clone-bundle --fail-fast 2>&1 | tee ../sync.log
          repo manifest -r -o ../resolved-manifest.xml
      - name: Apply audited recovery metadata repairs
        shell: bash
        run: python3 patch-build.py android
      - name: Stage checked device input
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android/device/motorola/fogona
          cp -a device/. android/device/motorola/fogona/
          mkdir -p android/device/motorola/fogona/prebuilt
          gzip -dc boot.img.gz > android/device/motorola/fogona/prebuilt/boot.img
          cd android
          sha256sum -c ../boot.sha256
      - name: Build recovery only
        env:
          FOGONA_RECOVERY_BUILD: "true"
        shell: bash
        run: |
          set -eo pipefail
          cd android
          {
            source build/envsetup.sh
            lunch twrp_fogona-eng
            m -j2 recoveryimage
          } 2>&1 | tee ../build.log
          cmp ../device/recovery/root/system/bin/device-rescue.sh out/target/product/fogona/recovery/root/system/bin/device-rescue.sh
          python3 ../verify-ramdisk.py out/target/product/fogona/recovery/root ../ramdisk-audit.json
          test -s out/target/product/fogona/recovery.img
          test "$(stat -c%s out/target/product/fogona/recovery.img)" -le 104857600
          sha256sum out/target/product/fogona/recovery.img > ../recovery.sha256
      - name: Save experimental image and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fogona-experimental-unvalidated
          retention-days: 7
          path: |
            sync.log
            build.log
            resolved-manifest.xml
            recovery.sha256
            compatibility-repairs.json
            ramdisk-audit.json
            android/out/target/product/fogona/recovery.img
